[project]
name = "fantasy-football-assistant"
version = "0.1.0"
description = "Terminal fantasy football assistant for Sleeper leagues"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.scripts]
ffa = "ffa.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ffa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
