[project]
name = "draftbot"
version = "0.1.0"
description = "Terminal assistant for live Sleeper snake drafts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.scripts]
draftbot = "draftbot.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["draftbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
